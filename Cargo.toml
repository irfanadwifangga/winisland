[package]
name = "winisland"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
raw-window-handle = "0.6"
slint = { version = "1.18.1", default-features = false, features = ["compat-1-18", "std", "backend-winit", "renderer-software", "system-tray", "raw-window-handle-06", "accessibility"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56.0"

[build-dependencies]
slint-build = "1.18.1"

# Profil untuk binary yang dipasang atau dibagikan. Build harian dan kontributor
# memakai `cargo run` / `cargo build --release` biasa.
[profile.dist]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true