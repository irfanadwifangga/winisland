[package]
name = "winisland"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "A tiny Dynamic Island-style overlay for Windows, built for low memory use"
license = "MIT"
repository = "https://github.com/irfanadwifangga/winisland"
publish = false

[dependencies]
raw-window-handle = "0.6"
slint = { version = "1.18.1", default-features = false, features = ["compat-1-18", "std", "backend-winit", "renderer-software", "system-tray", "raw-window-handle-06", "accessibility"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Power",
    "Win32_System_Performance",
    "Media_Control",
    "Foundation",
    "UI_Notifications_Management",
    "ApplicationModel",
    "Foundation_Collections",
] }
winreg = "0.56.0"

[build-dependencies]
slint-build = "1.18.1"

# Profil untuk binary yang dipasang atau dibagikan. Build harian dan kontributor
# memakai `cargo run` / `cargo build --release` biasa.
[profile.dist]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
